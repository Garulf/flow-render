[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow-render"
version = "0.14.3"
description = "Render a Flow Launcher plugin result as a screenshot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "jinja2",
    "python-datauri",
    "pillow",
    "httpx",
    "playwright",
    "pywin32; sys_platform == 'win32'",
]

[project.scripts]
flow-render = "flow_render.cli:run"

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flow_render"]
