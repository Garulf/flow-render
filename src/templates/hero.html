<html>

<head>

    <style>
        #Preview {
            margin: auto;
            width: 50%;
        }

        #WindowBorder {
            top: 150px;
            border-radius:5px;
            border-collapse: separate;
            border-style: solid;
            border-color: #cbcbcb;
            border-width: thin;
            width: 540px;
            background-color: f4f1f8;
            float: left;
            position: relative;
            /* filter: drop-shadow(0 0 0.4rem rgb(168, 168, 168)); */
            padding-bottom: 8px;
            transform-style: preserve-3d;
            transform:
                perspective(1000px)
                rotateY(0deg)
                rotateX(0deg);
        }

        #WindowBorder::after {
            content: "";
            inset: 0px;
            transform:
                translateY(70%)
                rotateX(90deg);
            position: absolute;
            filter: blur(60px);
            opacity: 0.5;
            background-color: #ffffff;
        }

        #QueryBoxArea {
            margin: 4 12 0 18;
            border: 0px solid #000;
            position: relative;
            height: 52;
        }

        #QueryBoxText {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            position: absolute;
            color: #000;
            z-index: 999;
        }

        #QueryBoxSuggestion {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            position: absolute;
            color: rgb(150, 150, 150);
        }

        #QueryBoxText::after {
            content: ' ';
            top: 50%;
            margin-left: 2px;
            transform: translateY(-50%);
            font-size: 28px;
            color: #000;
            background: #000;
            width: 2px;
            height: 32px;
            position: absolute;
        }

        #GlassIcon {
            right: 4;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5"

        }

        #Separator {
            position: relative;
            top: 0px;
            width: 520px;
            margin: 4 auto;
            background-color: #eaeaea;
            height: 1px;
        }

        .item {
            border: 0px solid #000;
            display: block;
            height: 52px;
            position: relative;
        }

        .selecteditem {
            border: 0px solid #000;
            background-color:#eae7ee;
            display: block;
            height: 52px;
            position: relative;
        }

        #Icon {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            width: 38;
            height: 38;
            border: 0px solid #000;
            float: left;
            display: table-cell;
            vertical-align: middle;
        }

        #Title {
            float: left;
            margin: 0 0 0 0;
            display: block;
            width: 400;
            font-size: 16px;
            overflow: hidden;
            text-wrap: nowrap;
        }
        #TitleSelected {
            color:#ffffff;
            float: left;
            margin: 0 0 0 0;
            display: block;
            width: 400;
            font-size: 16px;
            overflow: hidden;
            text-wrap: nowrap;
        }

        #subTitle {
            color:#787878;
            float: left;
            font-size: 13px;
            display: table-cell;
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
            text-wrap: nowrap;
            max-width: 400px;
        }

        #subTitleSelected {
            color:#ffffff;
            float: left;
            font-size: 13px;
            display: table-cell;
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
            text-wrap: nowrap;
            max-width: 400px;
        }

        #Hotkey {
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            float: right;
            width: 80px;
            border: 0px solid #000;
            text-align: center;
            font-size: 13px;
            color: #acacac;
        }
    </style>

</head>

<Body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">


    <Div>
        <Div id="Preview">
            <Div id="WindowBorder">
                <Div id="QueryBoxArea">
                    <div>
                        <Div id="QueryBoxText">{{ query }}</Div>
                        <Div id="QueryBoxSuggestion">{{ query_suggesion }}</Div>
                        <Div id="GlassIcon"><img src="{{ icon }}" width="32" height="32"></Div>
                    </div>
                </Div>
                <Div id="Separator"></Div>
                {% for item in items %}
                    <Div class="item {{ 'selecteditem' if selected == loop.index else '' }}">
                        <Div id="icon">
                            <img src="{{ item.icon }}" width="38" height="38">
                        </Div>
                        <div style="position: absolute;top: 50%; left:68px; transform: translateY(-50%);width:350px;border: 0px solid rgb(212, 70, 70);display:block; float:left;">
                            <div id="Title">{{ item.title }}</div>
                            <Div id="subTitle">{{ item.subtitle }}</Div>
                        </div>
                        <div id="Hotkey">{{ 'Alt+' ~ loop.index if loop.index <= 9 else '' }}</div>
                    </Div>
                {% endfor %}
        </Div>
     
    </Div>

</Body>

</html>
