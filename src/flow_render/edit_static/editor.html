<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>flow-render edit mode</title>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  #app { display: flex; height: 100%; }
  #preview-pane {
    flex: 1; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    /* Checkerboard so a transparent canvas is visibly transparent, not just "dark" —
       shows through the iframe naturally wherever its page background is transparent. */
    background-image:
      linear-gradient(45deg, #4a4a4a 25%, transparent 25%),
      linear-gradient(-45deg, #4a4a4a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #4a4a4a 75%),
      linear-gradient(-45deg, transparent 75%, #4a4a4a 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #2b2b2b;
  }
  /* Scaled to fit the pane via a CSS transform (never scrolled) — this only changes
     the on-screen display size, not the iframe's real pixel dimensions, which stay at
     the canvas size for accurate editing/capture. */
  #preview-frame { display: block; border: 2px solid #5a7aba; box-sizing: content-box; flex-shrink: 0; }
  #panel { width: 340px; padding: 16px; overflow-y: auto; background: #1c1c1c; color: #eee; box-sizing: border-box; }
  #panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: #999; margin: 20px 0 8px; }
  #panel h2:first-child { margin-top: 0; }
  #panel label { display: block; font-size: 12px; margin: 8px 0 2px; }
  #panel input[type=color], #panel input[type=text], #panel select, #panel textarea {
    width: 100%; box-sizing: border-box; margin-bottom: 4px;
  }
  .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 6px 0; }
  .checkbox-label input { margin: 0; }
  .slider-row { margin: 8px 0; }
  .slider-controls { display: flex; align-items: center; gap: 6px; }
  .slider-controls input[type=range] { flex: 1; }
  .slider-controls input[type=number] { width: 64px; box-sizing: border-box; }
  .reset-btn { background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; border-radius: 4px;
    cursor: pointer; padding: 2px 6px; font-size: 12px; line-height: 1; }
  .reset-btn:hover { background: #3a3a3a; }
  .size-row { display: flex; gap: 8px; align-items: center; }
  .size-row input[type=number] { width: 80px; box-sizing: border-box; }
  .element-btn { display: block; width: 100%; text-align: left; padding: 6px 8px; margin: 2px 0;
    background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; border-radius: 4px; cursor: pointer; }
  .element-btn.selected { background: #3a5a8a; border-color: #5a7aba; }
  .layer-tab { display: inline-block; padding: 4px 10px; margin: 2px; background: #2a2a2a; color: #eee;
    border: 1px solid #3a3a3a; border-radius: 4px; cursor: pointer; }
  .layer-tab.active { background: #3a5a8a; }
  #save-row { margin-top: 24px; display: flex; gap: 6px; }
  #save-row input { flex: 1; }
  #save-status { font-size: 12px; color: #7dc47d; margin-top: 6px; min-height: 1em; }
  #capture-row { margin-top: 12px; }
  #capture-row button { width: 100%; padding: 6px; }
  #capture-status { font-size: 12px; color: #7dc47d; margin-top: 6px; min-height: 1em; }
  #preview-error-banner { display: none; position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    background: #5a1e1e; color: #ffd6d6; font-family: monospace; font-size: 12px; padding: 8px 12px;
    box-sizing: border-box; white-space: pre-wrap; border-bottom: 1px solid #a33; }
</style>
</head>
<body>
<div id="app">
  <div id="preview-pane">
    <div id="preview-error-banner"></div>
    <iframe id="preview-frame"></iframe>
  </div>
  <div id="panel">
    <h2>Canvas</h2>
    <div class="size-row">
      <label style="margin:0">Width <input type="number" id="canvas-width" min="200" max="8000" value="1280"></label>
      <label style="margin:0">Height <input type="number" id="canvas-height" min="200" max="8000" value="720"></label>
    </div>

    <div id="canvas-mode-group">
      <label class="checkbox-label"><input type="radio" name="canvas-mode" id="canvas-mode-default" value="default" checked> Theme default</label>
      <label class="checkbox-label"><input type="radio" name="canvas-mode" id="canvas-mode-gradient" value="gradient"> Gradient</label>
      <label class="checkbox-label"><input type="radio" name="canvas-mode" id="canvas-mode-transparent" value="transparent"> Transparent</label>
    </div>
    <div id="canvas-gradient-controls">
      <label>Gradient type</label>
      <select id="canvas-gradient-type">
        <option value="linear">Linear</option>
        <option value="radial">Radial</option>
      </select>
      <div id="canvas-angle-row"></div>
      <div id="canvas-position-row" style="display:none">
        <div id="canvas-center-x-row"></div>
        <div id="canvas-center-y-row"></div>
      </div>
      <div id="canvas-stops"></div>
      <button type="button" id="canvas-add-stop-btn">+ Add color stop</button>
    </div>

    <h2>Window shine</h2>
    <label class="checkbox-label"><input type="checkbox" id="shine-enabled"> Enable</label>
    <div id="shine-controls" style="display:none">
      <label>Gradient type</label>
      <select id="shine-gradient-type">
        <option value="linear">Linear</option>
        <option value="radial">Radial</option>
      </select>
      <div id="shine-angle-row"></div>
      <div id="shine-position-row" style="display:none">
        <div id="shine-center-x-row"></div>
        <div id="shine-center-y-row"></div>
      </div>
      <div id="shine-stops"></div>
      <button type="button" id="shine-add-stop-btn">+ Add color stop</button>
    </div>

    <h2>Selected result</h2>
    <select id="selection-select"></select>

    <h2>Elements</h2>
    <div id="element-list"></div>

    <div id="element-panel" style="display:none">
      <h2 id="element-panel-title">Element</h2>
      <div id="element-transform-controls"></div>
    </div>

    <h2>Text layers</h2>
    <div id="layer-tabs"></div>
    <button id="add-layer-btn">+ Add layer</button>
    <div id="layer-panel" style="display:none">
      <label>Jinja2 template</label>
      <textarea id="layer-template" rows="2">{{ plugin.Name }}</textarea>
      <label>Font size (px)</label>
      <input type="range" id="layer-font-size" min="8" max="300" value="32">
      <label>Font family</label>
      <select id="layer-font-family">
        <option value="inherit">Theme default</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="'Segoe UI', sans-serif">Segoe UI</option>
        <option value="'Segoe UI Semibold', sans-serif">Segoe UI Semibold</option>
        <option value="'Helvetica Neue', sans-serif">Helvetica Neue</option>
        <option value="Calibri, sans-serif">Calibri</option>
        <option value="Tahoma, sans-serif">Tahoma</option>
        <option value="Verdana, sans-serif">Verdana</option>
        <option value="'Century Gothic', sans-serif">Century Gothic</option>
        <option value="'Franklin Gothic Medium', sans-serif">Franklin Gothic Medium</option>
        <option value="'Gill Sans', sans-serif">Gill Sans</option>
        <option value="Futura, sans-serif">Futura</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
        <option value="Bahnschrift, sans-serif">Bahnschrift</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="'Palatino Linotype', serif">Palatino Linotype</option>
        <option value="Garamond, serif">Garamond</option>
        <option value="'Book Antiqua', serif">Book Antiqua</option>
        <option value="Rockwell, serif">Rockwell</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="Consolas, monospace">Consolas</option>
        <option value="'Cascadia Code', monospace">Cascadia Code</option>
        <option value="'Lucida Console', monospace">Lucida Console</option>
        <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
        <option value="Impact, sans-serif">Impact</option>
      </select>
      <label>Color</label>
      <input type="color" id="layer-color" value="#ffffff">
      <label>Color opacity</label>
      <input type="range" id="layer-color-opacity" min="0" max="1" step="0.01" value="1">
      <label>Weight</label>
      <select id="layer-weight">
        <option value="normal">Normal</option>
        <option value="bold">Bold</option>
      </select>
      <div id="layer-transform-controls"></div>
      <button id="remove-layer-btn" style="margin-top:12px">🗑 Remove layer</button>
    </div>

    <div id="save-row">
      <input type="text" id="save-filename" placeholder="theme name">
      <button id="save-btn">Save</button>
    </div>
    <div id="save-status"></div>

    <div id="capture-row">
      <button id="capture-btn">📷 Capture screenshot</button>
    </div>
    <div id="capture-status"></div>
  </div>
</div>
<script>
const SELECTABLE = [
  { label: 'Window', selector: '#WindowBorder' },
  { label: 'Search icon', selector: '#GlassIcon' },
  { label: 'Query box', selector: '#QueryBoxArea' },
  { label: 'Separator', selector: '#Separator' },
  { label: 'Result row', selector: '.item' },
  { label: 'Selected row', selector: '.selecteditem' },
  { label: 'Result icon', selector: '.icon' },
  { label: 'Title', selector: '.Title' },
  { label: 'Subtitle', selector: '.SubTitle' },
  { label: 'Hotkey', selector: '.Hotkey' },
];
const LAYER_SLOTS = 4;
const AXES = [
  { key: 'translate_x', label: 'Translate X (px)', min: -2000, max: 2000, step: 1, reset: 0 },
  { key: 'translate_y', label: 'Translate Y (px)', min: -2000, max: 2000, step: 1, reset: 0 },
  { key: 'translate_z', label: 'Translate Z (px)', min: -3000, max: 3000, step: 5, reset: 0 },
  { key: 'rotate_x', label: 'Rotate X (deg)', min: -360, max: 360, step: 1, reset: 0 },
  { key: 'rotate_y', label: 'Rotate Y (deg)', min: -360, max: 360, step: 1, reset: 0 },
  { key: 'rotate_z', label: 'Rotate Z (deg)', min: -360, max: 360, step: 1, reset: 0 },
  { key: 'scale', label: 'Scale', min: 0.05, max: 5, step: 0.05, reset: 1 },
  { key: 'perspective', label: 'Perspective (px, 0 = off)', min: 0, max: 6000, step: 50, reset: 0 },
  { key: 'opacity', label: 'Opacity', min: 0, max: 1, step: 0.01, reset: 1 },
];
// Numeric shadow sliders — shadow_color is a separate <input type=color>, added
// alongside these in createTransformControls since it doesn't fit the pure-numeric
// slider pattern the rest of AXES/SHADOW_AXES share.
const SHADOW_AXES = [
  { key: 'shadow_x', label: 'Shadow X (px)', min: -100, max: 100, step: 1, reset: 0 },
  { key: 'shadow_y', label: 'Shadow Y (px)', min: -100, max: 100, step: 1, reset: 0 },
  { key: 'shadow_blur', label: 'Shadow blur (px)', min: 0, max: 100, step: 1, reset: 0 },
  { key: 'shadow_opacity', label: 'Shadow opacity', min: 0, max: 1, step: 0.01, reset: 0 },
];
const DEFAULT_TRANSFORM = {
  translate_x: 0, translate_y: 0, translate_z: 0,
  rotate_x: 0, rotate_y: 0, rotate_z: 0, scale: 1, perspective: 0, opacity: 1,
  shadow_x: 0, shadow_y: 0, shadow_blur: 0, shadow_color: '#000000', shadow_opacity: 0,
};
// These selectors center themselves with `transform: translateY(-50%)` in every
// bundled theme — must match src/flow_render/edit_state.py's TRANSFORM_PRESERVE_PREFIX,
// or an edit-mode transform would replace that centering instead of composing with it.
const TRANSFORM_PRESERVE_PREFIX = {
  '#GlassIcon': 'translateY(-50%)',
  '.icon': 'translateY(-50%)',
  '.Hotkey': 'translateY(-50%)',
};

const frame = document.getElementById('preview-frame');
let currentState = null;
let selectedSelector = null;
let selectedLayer = null;

// Debounced functions also expose .flush()/.flushAll(), which cancel any pending
// timer and run the call immediately, returning a promise for it. Without this,
// anything that needs the server to be fully up to date *right now* (a full
// reload, Capture, Save) could run while an edit is still sitting in a debounce
// window — reading stale state and looking like the edit "didn't happen" or a
// screenshot "didn't match" what was just changed in the live preview.
function debounce(fn, ms) {
  let timer = null;
  let pendingArgs = null;
  const debounced = (...args) => {
    pendingArgs = args;
    clearTimeout(timer);
    timer = setTimeout(() => debounced.flush(), ms);
  };
  debounced.flush = () => {
    if (timer === null) return Promise.resolve();
    clearTimeout(timer);
    timer = null;
    const args = pendingArgs;
    pendingArgs = null;
    return Promise.resolve(fn(...args));
  };
  return debounced;
}

// Like debounce(), but keeps one independent timer per `key` instead of a single
// shared one. Without this, editing element/layer A and quickly switching to
// element/layer B within the debounce window cancels A's still-pending send
// (since a single shared timer treats "any call" as "reschedule the one timer"),
// silently dropping A's edit — it never reaches the server, so A reverts to its
// last-persisted value on the next reload, which looks like "changing B reset A".
//
// Timers/pending are keyed by String(key) since object keys are always strings,
// but the ORIGINAL key (e.g. a numeric layer slot) is stashed alongside its args
// and passed to `fn` on flush — Object.keys() would otherwise hand flushKey a
// stringified key ("0" instead of 0), which a server expecting a numeric slot
// index rejects, silently dropping the flushed edit.
function debounceByKey(fn, ms) {
  const timers = {};
  const pending = {};
  const flushKey = (stringKey) => {
    if (!(stringKey in timers)) return Promise.resolve();
    clearTimeout(timers[stringKey]);
    delete timers[stringKey];
    const { key, args } = pending[stringKey];
    delete pending[stringKey];
    return Promise.resolve(fn(key, ...args));
  };
  const debounced = (key, ...args) => {
    const stringKey = String(key);
    pending[stringKey] = { key, args };
    clearTimeout(timers[stringKey]);
    timers[stringKey] = setTimeout(() => flushKey(stringKey), ms);
  };
  debounced.flushAll = () => Promise.all(Object.keys(timers).map(flushKey));
  return debounced;
}

function transformToCss(t, preservePrefix = '') {
  const perspectivePrefix = t.perspective ? `perspective(${t.perspective}px) ` : '';
  const preserve = preservePrefix ? `${preservePrefix} ` : '';
  return `${preserve}${perspectivePrefix}translate3d(${t.translate_x}px, ${t.translate_y}px, ${t.translate_z}px) `
    + `rotateX(${t.rotate_x}deg) rotateY(${t.rotate_y}deg) rotateZ(${t.rotate_z}deg) scale(${t.scale})`;
}

function hexToRgba(hex, opacity) {
  let value = (hex || '#000000').replace('#', '');
  if (value.length === 3) value = value.split('').map((c) => c + c).join('');
  const r = parseInt(value.substring(0, 2), 16);
  const g = parseInt(value.substring(2, 4), 16);
  const b = parseInt(value.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${opacity})`;
}

// opacity/filter are separate CSS properties, not part of `transform:` — mirrors
// Transform.extra_declarations() in edit_state.py so the live iframe matches what
// a full reload of the server-rendered CSS would show.
function transformExtraStyles(t) {
  const styles = { opacity: '', filter: '' };
  if (t.opacity !== undefined && t.opacity !== 1) styles.opacity = String(t.opacity);
  if (t.shadow_opacity) {
    const color = hexToRgba(t.shadow_color, t.shadow_opacity);
    styles.filter = `drop-shadow(${t.shadow_x || 0}px ${t.shadow_y || 0}px ${t.shadow_blur || 0}px ${color})`;
  }
  return styles;
}

// A single slider + live number box + reset button, wired to call onChange(value) on any interaction.
// `reset` is the value the reset button restores (0 for translate/rotate, 1 for scale).
function createSliderRow(container, { id, label, min, max, step = 1, value = 0, reset: resetValue = 0, onChange }) {
  const row = document.createElement('div');
  row.className = 'slider-row';
  const labelEl = document.createElement('label');
  labelEl.textContent = label;
  const controls = document.createElement('div');
  controls.className = 'slider-controls';

  const range = document.createElement('input');
  range.type = 'range'; range.min = min; range.max = max; range.step = step; range.value = value; range.id = `${id}-range`;
  const num = document.createElement('input');
  num.type = 'number'; num.min = min; num.max = max; num.step = step; num.value = value; num.id = `${id}-num`;
  const reset = document.createElement('button');
  reset.type = 'button'; reset.textContent = '↺'; reset.title = 'Reset'; reset.className = 'reset-btn';

  const set = (v) => { range.value = v; num.value = v; onChange(Number(v)); };
  range.addEventListener('input', () => set(range.value));
  num.addEventListener('input', () => set(num.value === '' ? resetValue : num.value));
  reset.addEventListener('click', () => set(resetValue));

  controls.append(range, num, reset);
  row.append(labelEl, controls);
  container.appendChild(row);
  return { setValue: (v) => { range.value = v; num.value = v; } };
}

// Builds the translate/rotate/scale/perspective sliders into `container`.
// onChange(values) fires with the full {translate_x..rotate_z, scale, perspective} object on any edit.
function createTransformControls(container, prefix, onChange) {
  container.innerHTML = '';
  const rows = {};
  const values = { ...DEFAULT_TRANSFORM };

  AXES.forEach(({ key, label, min, max, step, reset }) => {
    rows[key] = createSliderRow(container, {
      id: `${prefix}-${key}`, label, min, max, step, reset, value: values[key],
      onChange: (v) => { values[key] = v; onChange({ ...values }); },
    });
  });

  const shadowColorLabel = document.createElement('label');
  shadowColorLabel.textContent = 'Shadow color';
  container.appendChild(shadowColorLabel);
  const shadowColor = document.createElement('input');
  shadowColor.type = 'color';
  shadowColor.id = `${prefix}-shadow_color`;
  shadowColor.value = values.shadow_color;
  shadowColor.addEventListener('input', () => {
    values.shadow_color = shadowColor.value;
    onChange({ ...values });
  });
  container.appendChild(shadowColor);

  SHADOW_AXES.forEach(({ key, label, min, max, step, reset }) => {
    rows[key] = createSliderRow(container, {
      id: `${prefix}-${key}`, label, min, max, step, reset, value: values[key],
      onChange: (v) => { values[key] = v; onChange({ ...values }); },
    });
  });

  return {
    setValues(transform) {
      const t = { ...DEFAULT_TRANSFORM, ...(transform || {}) };
      Object.assign(values, t);
      AXES.forEach(({ key }) => rows[key].setValue(t[key]));
      SHADOW_AXES.forEach(({ key }) => rows[key].setValue(t[key]));
      shadowColor.value = t.shadow_color;
    },
  };
}

async function loadPreview() {
  const res = await fetch('/preview');
  const html = await res.text();
  frame.srcdoc = html;
  await new Promise((resolve) => { frame.onload = resolve; });
  wireClickHandlers();
  applyCanvasSize();
  updateWindowOverflowForFrame();
  await refreshPreviewError();
}

async function refreshPreviewError() {
  const banner = document.getElementById('preview-error-banner');
  try {
    const res = await fetch('/preview-error');
    const result = await res.json();
    if (result.error) {
      banner.textContent = result.error;
      banner.style.display = 'block';
    } else {
      banner.style.display = 'none';
      banner.textContent = '';
    }
  } catch (err) {
    console.error('Failed to fetch preview error state', err);
  }
}

const SCALE_AXIS = AXES.find((axis) => axis.key === 'scale');

// Wires an element up for click-to-select, drag-to-translate (X/Y), and
// scroll-wheel-to-scale, all funneled through the same apply/persist/panel-sync
// path the sliders use (`setValues`) so dragging in the preview and dragging a
// slider can never leave the panel and the live DOM out of sync.
//
// A plain click (mousedown+mouseup with no mousemove in between) only selects —
// no mousemove event fires for zero movement, so no transform update is sent.
function attachDragAndScale(el, { select, getValues, setValues }) {
  el.style.cursor = 'move';

  el.addEventListener('mousedown', (event) => {
    if (event.button !== 0) return;
    event.preventDefault();
    event.stopPropagation();
    select();
    const doc = el.ownerDocument;
    const start = { ...getValues() };
    const startX = event.clientX;
    const startY = event.clientY;

    function onMouseMove(moveEvent) {
      setValues({
        ...start,
        translate_x: start.translate_x + (moveEvent.clientX - startX),
        translate_y: start.translate_y + (moveEvent.clientY - startY),
      });
    }
    function onMouseUp() {
      doc.removeEventListener('mousemove', onMouseMove);
      doc.removeEventListener('mouseup', onMouseUp);
      // Also listen on the outer document: if the drag ends after the cursor
      // left the iframe, the iframe's own document never sees that mouseup,
      // which would otherwise leave these listeners attached indefinitely.
      document.removeEventListener('mouseup', onMouseUp);
    }
    doc.addEventListener('mousemove', onMouseMove);
    doc.addEventListener('mouseup', onMouseUp);
    document.addEventListener('mouseup', onMouseUp);
  });

  el.addEventListener('wheel', (event) => {
    event.preventDefault();
    event.stopPropagation();
    select();
    const values = getValues();
    const direction = event.deltaY < 0 ? 1 : -1;
    const nextScale = Math.min(
      SCALE_AXIS.max,
      Math.max(SCALE_AXIS.min, Math.round((values.scale + direction * SCALE_AXIS.step) * 100) / 100),
    );
    setValues({ ...values, scale: nextScale });
  }, { passive: false });
}

function wireClickHandlers() {
  const doc = frame.contentDocument;
  SELECTABLE.forEach(({ selector }) => {
    doc.querySelectorAll(selector).forEach((el) => {
      attachDragAndScale(el, {
        select: () => selectElement(selector),
        getValues: () => (currentState.elements && currentState.elements[selector]) || DEFAULT_TRANSFORM,
        setValues: (values) => applyAndPersistElementTransform(selector, values),
      });
    });
  });
  for (let i = 0; i < LAYER_SLOTS; i++) {
    doc.querySelectorAll(`#Layer${i + 1}`).forEach((el) => {
      attachDragAndScale(el, {
        select: () => selectLayer(i),
        getValues: () => currentState.layers[i].transform,
        setValues: (values) => applyAndPersistLayerTransform(i, values),
      });
    });
  }
}

function applyCanvasSize() {
  frame.style.width = `${currentState.canvas_width}px`;
  frame.style.height = `${currentState.canvas_height}px`;
  fitCanvasToPane();
}

// Scales the iframe down (CSS transform only — never upscaled, never affects the
// iframe's real pixel size) so the full canvas is always visible without scrolling.
function fitCanvasToPane() {
  const pane = document.getElementById('preview-pane');
  const availableWidth = pane.clientWidth;
  const availableHeight = pane.clientHeight;
  const scale = Math.min(availableWidth / currentState.canvas_width, availableHeight / currentState.canvas_height, 1);
  frame.style.transform = `scale(${scale})`;
  frame.style.transformOrigin = 'center center';
}

window.addEventListener('resize', debounce(() => {
  if (currentState) fitCanvasToPane();
}, 100));

async function fetchState() {
  const res = await fetch('/state');
  currentState = await res.json();
  return currentState;
}

// Persists a change to the server without reloading the preview — used whenever the
// change was already applied live to the iframe's DOM, so a full reload would just be
// redundant round-trip latency (this is what made dragging a slider feel sluggish).
async function persistUpdate(payload) {
  const res = await fetch('/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    const status = document.getElementById('save-status');
    try {
      const result = await res.json();
      status.textContent = `Update failed: ${result.error}`;
      console.error('Update failed:', result.error);
    } catch (err) {
      status.textContent = 'Update failed.';
      console.error('Update failed with unparseable response', err);
    }
  }
}

// Persists a change AND reloads the full preview — needed only when the server has to
// re-render (Jinja2 template text resolution, or making a brand-new element visible).
async function persistUpdateAndReload(payload) {
  await flushPendingUpdates();
  await persistUpdate(payload);
  await loadPreview();
}

// Forces every still-pending debounced send (any element, any layer's transform,
// a layer's template text, the canvas) to fire immediately and awaits them, so
// whatever runs next (a full reload, Save, Capture) sees fully up-to-date state
// instead of racing an edit that hasn't reached the server yet.
async function flushPendingUpdates() {
  await Promise.all([
    sendElementUpdate.flushAll(),
    sendLayerUpdate.flushAll(),
    sendLayerTemplateUpdate.flushAll(),
    sendCanvasUpdate.flush(),
    sendCanvasSizeUpdate.flush(),
    sendShineUpdate.flush(),
  ]);
}

function renderElementList() {
  const list = document.getElementById('element-list');
  list.innerHTML = '';
  SELECTABLE.forEach(({ label, selector }) => {
    const btn = document.createElement('button');
    btn.className = 'element-btn' + (selector === selectedSelector ? ' selected' : '');
    btn.textContent = label;
    btn.onclick = () => selectElement(selector);
    list.appendChild(btn);
  });
}

// Shared by the transform-panel sliders and by dragging/scrolling an element
// directly in the preview — both apply the same live-DOM + persist + panel-sync
// path, so neither one can leave the sliders and iframe DOM disagreeing.
function applyAndPersistElementTransform(selector, values) {
  applyTransformToFrame(selector, values);
  currentState.elements = currentState.elements || {};
  currentState.elements[selector] = values;
  updateWindowOverflowForFrame();
  sendElementUpdate(selector, values);
  if (selector === selectedSelector) {
    elementControls.setValues(values);
  }
}

const elementControls = createTransformControls(
  document.getElementById('element-transform-controls'), 'el',
  (values) => {
    if (!selectedSelector) return;
    applyAndPersistElementTransform(selectedSelector, values);
  },
);

function applyTransformToFrame(selector, values) {
  const doc = frame.contentDocument;
  if (!doc) return;
  const css = transformToCss(values, TRANSFORM_PRESERVE_PREFIX[selector] || '');
  const extra = transformExtraStyles(values);
  doc.querySelectorAll(selector).forEach((el) => {
    el.style.transform = css;
    el.style.opacity = extra.opacity;
    el.style.filter = extra.filter;
  });
}

function isDefaultTransformValues(t) {
  return t.translate_x === 0 && t.translate_y === 0 && t.translate_z === 0
    && t.rotate_x === 0 && t.rotate_y === 0 && t.rotate_z === 0
    && t.scale === 1 && !t.perspective && t.opacity === 1 && !t.shadow_opacity;
}

// Mirrors edit_state.py's server-side rule (only baked into the rendered CSS on a
// full reload): any element other than #WindowBorder with a non-default transform
// should let #WindowBorder's own overflow go from hidden to visible, so it can
// visually extend past the window's edges. Since most transform edits apply
// instantly to the live DOM without a full reload (for responsiveness), this has
// to be applied client-side too, or the live preview stays clipped until the next
// reload even though the saved/re-rendered CSS would be correct.
function updateWindowOverflowForFrame() {
  const doc = frame.contentDocument;
  if (!doc) return;
  const windowEl = doc.querySelector('#WindowBorder');
  if (!windowEl) return;
  const anyInnerTransformed = Object.entries(currentState.elements || {}).some(
    ([selector, t]) => selector !== '#WindowBorder' && !isDefaultTransformValues(t)
  );
  windowEl.style.overflow = anyInnerTransformed ? 'visible' : '';
}

const sendElementUpdate = debounceByKey((selector, values) => {
  persistUpdate({ type: 'element', selector, transform: values });
}, 150);

function selectElement(selector) {
  selectedSelector = selector;
  selectedLayer = null;
  document.getElementById('layer-panel').style.display = 'none';
  document.getElementById('element-panel').style.display = 'block';
  document.getElementById('element-panel-title').textContent = selector;
  const transform = (currentState.elements && currentState.elements[selector]) || DEFAULT_TRANSFORM;
  elementControls.setValues(transform);
  renderElementList();
}

function renderLayerTabs() {
  const tabs = document.getElementById('layer-tabs');
  tabs.innerHTML = '';
  for (let i = 0; i < LAYER_SLOTS; i++) {
    const layer = currentState.layers[i];
    if (!layer.active) continue;
    const tab = document.createElement('span');
    tab.className = 'layer-tab' + (i === selectedLayer ? ' active' : '');
    tab.textContent = `Layer ${i + 1}`;
    tab.onclick = () => selectLayer(i);
    tabs.appendChild(tab);
  }
  document.getElementById('add-layer-btn').disabled =
    currentState.layers.every((layer) => layer.active);
}

// Shared by the transform-panel sliders and by dragging/scrolling a layer
// directly in the preview.
function applyAndPersistLayerTransform(slot, values) {
  applyTransformToFrame(`#Layer${slot + 1}`, values);
  if (currentState.layers[slot]) currentState.layers[slot].transform = values;
  if (slot === selectedLayer) {
    layerControls.setValues(values);
    // currentLayerPayload() reads the DOM synchronously right now (the sliders
    // already reflect `values` at this point), so this freezes slot's payload
    // immediately rather than letting a debounced callback re-read the DOM
    // 150ms later — by which point the user may have switched to another layer.
    sendLayerUpdate(slot, currentLayerPayload());
  }
}

const layerControls = createTransformControls(
  document.getElementById('layer-transform-controls'), 'layer',
  (values) => {
    if (selectedLayer === null) return;
    applyAndPersistLayerTransform(selectedLayer, values);
  },
);

function currentLayerPayload() {
  return {
    active: true,
    template: document.getElementById('layer-template').value,
    font_size: Number(document.getElementById('layer-font-size').value),
    font_family: document.getElementById('layer-font-family').value,
    color: document.getElementById('layer-color').value,
    color_opacity: Number(document.getElementById('layer-color-opacity').value),
    weight: document.getElementById('layer-weight').value,
    transform: currentLayerTransformValues(),
  };
}

// createTransformControls doesn't expose its live values directly (only via onChange),
// so this re-reads the same DOM inputs createSliderRow wired up for the layer panel.
function currentLayerTransformValues() {
  const values = { ...DEFAULT_TRANSFORM };
  AXES.forEach(({ key, reset }) => {
    const raw = document.getElementById(`layer-${key}-num`).value;
    values[key] = raw === '' ? reset : Number(raw);
  });
  SHADOW_AXES.forEach(({ key, reset }) => {
    const raw = document.getElementById(`layer-${key}-num`).value;
    values[key] = raw === '' ? reset : Number(raw);
  });
  values.shadow_color = document.getElementById('layer-shadow_color').value;
  return values;
}

function applyLayerStyleToFrame(index, layer) {
  const doc = frame.contentDocument;
  if (!doc) return;
  const el = doc.querySelector(`#Layer${index + 1}`);
  if (!el) return;
  el.style.display = 'block';
  el.style.fontSize = `${layer.font_size}px`;
  el.style.fontFamily = layer.font_family;
  el.style.color = layer.color_opacity !== 1 ? hexToRgba(layer.color, layer.color_opacity) : layer.color;
  el.style.fontWeight = layer.weight;
  el.style.transform = transformToCss(layer.transform);
  const extra = transformExtraStyles(layer.transform);
  el.style.opacity = extra.opacity;
  el.style.filter = extra.filter;
}

const sendLayerUpdate = debounceByKey((slot, layer) => {
  persistUpdate({ type: 'layer', slot, layer });
}, 150);

const sendLayerTemplateUpdate = debounceByKey((slot, layer) => {
  persistUpdateAndReload({ type: 'layer', slot, layer })
    .then(fetchState)
    // Only refresh the panel if still on the same layer — the user may have
    // switched to another one during this debounce/reload round trip.
    .then(() => { if (selectedLayer === slot) selectLayer(slot); });
}, 300);

document.getElementById('layer-template').addEventListener('input', () => {
  if (selectedLayer === null) return;
  sendLayerTemplateUpdate(selectedLayer, currentLayerPayload());
});

['layer-font-size', 'layer-font-family', 'layer-color', 'layer-color-opacity', 'layer-weight'].forEach((id) => {
  const apply = () => {
    if (selectedLayer === null) return;
    const slot = selectedLayer;
    const layer = currentLayerPayload();
    applyLayerStyleToFrame(slot, layer);
    sendLayerUpdate(slot, layer);
  };
  document.getElementById(id).addEventListener('input', apply);
  document.getElementById(id).addEventListener('change', apply);
});

function selectLayer(index) {
  selectedLayer = index;
  selectedSelector = null;
  document.getElementById('element-panel').style.display = 'none';
  document.getElementById('layer-panel').style.display = 'block';

  document.getElementById('layer-weight').value = layer.weight;

}

const MAX_GRADIENT_STOPS = 6;
let canvasStops = [
  { color: '#1a1a2e', position: 0 },
  { color: '#16213e', position: 100 },
];

// Stops are rendered dynamically (2-6 of them) rather than a fixed pair of
// <input type=color> elements, so gradients aren't locked to exactly two colors.
function renderCanvasStops() {
  const container = document.getElementById('canvas-stops');
  container.innerHTML = '';
  canvasStops.forEach((stop, index) => {
    const row = document.createElement('div');
    row.className = 'slider-row';
    const label = document.createElement('label');
    label.textContent = `Stop ${index + 1}`;
    const controls = document.createElement('div');
    controls.className = 'slider-controls';

    const color = document.createElement('input');
    color.type = 'color';
    color.value = stop.color;
    color.addEventListener('input', () => {
      canvasStops[index].color = color.value;
      applyAndSendCanvasUpdate();
    });

    const position = document.createElement('input');
    position.type = 'number';
    position.min = 0; position.max = 100;
    position.value = stop.position;
    position.addEventListener('input', () => {
      canvasStops[index].position = Number(position.value) || 0;
      applyAndSendCanvasUpdate();
    });

    controls.append(color, position);
    if (canvasStops.length > 2) {
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '✕';
      removeBtn.title = 'Remove stop';
      removeBtn.className = 'reset-btn';
      removeBtn.addEventListener('click', () => {
        canvasStops.splice(index, 1);
        renderCanvasStops();
        applyAndSendCanvasUpdate();
      });
      controls.append(removeBtn);
    }
    row.append(label, controls);
    container.appendChild(row);
  });
  document.getElementById('canvas-add-stop-btn').disabled = canvasStops.length >= MAX_GRADIENT_STOPS;
}

document.getElementById('canvas-add-stop-btn').addEventListener('click', () => {
  if (canvasStops.length >= MAX_GRADIENT_STOPS) return;
  const last = canvasStops[canvasStops.length - 1];
  canvasStops.push({ color: '#ffffff', position: Math.min(100, last.position + 10) });
  renderCanvasStops();
  applyAndSendCanvasUpdate();
});

document.getElementById('canvas-gradient-type').addEventListener('change', () => {

  applyAndSendCanvasUpdate();
});

renderCanvasStops();

function currentCanvasGradientCss() {
  const stopsCss = canvasStops.map((s) => `${s.color} ${s.position}%`).join(', ');
  if (document.getElementById('canvas-gradient-type').value === 'radial') {
    const centerX = Number(document.getElementById('canvas-center-x-num').value) || 0;
    const centerY = Number(document.getElementById('canvas-center-y-num').value) || 0;
    return `radial-gradient(circle at ${centerX}% ${centerY}%, ${stopsCss})`;
  }
  const angle = Number(document.getElementById('canvas-angle-num').value) || 0;
  return `linear-gradient(${angle}deg, ${stopsCss})`;
}

function currentCanvasMode() {

}

function applyCanvasBackgroundToFrame() {
  const doc = frame.contentDocument;
  if (!doc) return;

  let value = '';
  if (mode === 'transparent') {
    value = 'transparent';
  } else if (mode === 'gradient') {
    value = currentCanvasGradientCss();

const sendCanvasUpdate = debounce(() => {

let shineStops = [
  { color: '#ffffff', position: 30, opacity: 0 },

function renderShineStops() {
  const container = document.getElementById('shine-stops');

}

function syncControlsFromState() {
  const hasGradient = !!(currentState.canvas && currentState.canvas.stops && currentState.canvas.stops.length);
  const mode = currentState.transparent ? 'transparent' : (hasGradient ? 'gradient' : 'default');
  document.getElementById(`canvas-mode-${mode}`).checked = true;
  updateCanvasControlsVisibility();
  if (currentState.canvas) {
    angleRow.setValue(currentState.canvas.angle);
    centerXRow.setValue(currentState.canvas.center_x === undefined ? 50 : currentState.canvas.center_x);
    centerYRow.setValue(currentState.canvas.center_y === undefined ? 50 : currentState.canvas.center_y);
    document.getElementById('canvas-gradient-type').value = currentState.canvas.gradient_type || 'linear';
    updateGradientTypeControlsVisibility();
    const stops = currentState.canvas.stops || [];
    if (stops.length) {
      canvasStops = stops.map((s) => ({ color: s.color, position: s.position }));
      renderCanvasStops();
    }
  }
  document.getElementById('canvas-width').value = currentState.canvas_width;
  document.getElementById('canvas-height').value = currentState.canvas_height;

  const shineEnabled = !!(currentState.window_shine && currentState.window_shine.stops
    && currentState.window_shine.stops.length);
  document.getElementById('shine-enabled').checked = shineEnabled;
  document.getElementById('shine-controls').style.display = shineEnabled ? 'block' : 'none';
  if (currentState.window_shine) {
    shineAngleRow.setValue(currentState.window_shine.angle);
    shineCenterXRow.setValue(currentState.window_shine.center_x === undefined ? 50 : currentState.window_shine.center_x);
    shineCenterYRow.setValue(currentState.window_shine.center_y === undefined ? 50 : currentState.window_shine.center_y);
    document.getElementById('shine-gradient-type').value = currentState.window_shine.gradient_type || 'linear';
    updateShineTypeControlsVisibility();
    const stops = currentState.window_shine.stops || [];
    if (stops.length) {
      shineStops = stops.map((s) => ({ color: s.color, position: s.position, opacity: s.opacity === undefined ? 1 : s.opacity }));
      renderShineStops();
    }
  }

  const select = document.getElementById('selection-select');
  select.innerHTML = '';
  (currentState.results || []).forEach((result, index) => {
    const option = document.createElement('option');
    option.value = index;
    option.textContent = result.title || `Result ${index + 1}`;
    select.appendChild(option);
  });
  select.value = currentState.selection;
}

function applySelectionToFrame(index) {
  const doc = frame.contentDocument;
  if (!doc) return;
  doc.querySelectorAll('.item').forEach((el, i) => {
    el.classList.toggle('selecteditem', i === index);
  });
}

document.getElementById('selection-select').addEventListener('change', (event) => {
  const index = Number(event.target.value);
  currentState.selection = index;
  applySelectionToFrame(index);
  persistUpdate({ type: 'selection', index });
});

(async function init() {
  await fetchState();
  syncControlsFromState();
  renderElementList();
  renderLayerTabs();
  await loadPreview();
})();
</script>
</body>
</html>
