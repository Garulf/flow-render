<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        /* Selawik stands in for Segoe UI so renders match on any platform. */
        @font-face {
            font-family: 'Segoe UI';
            font-weight: normal;
            src: url('{{ static_url }}/fonts/selawk.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Segoe UI';
            font-weight: bold;
            src: url('{{ static_url }}/fonts/selawkb.woff2') format('woff2');
        }
        {% filter indent(width=8) %}
        {%- include 'style.css' ignore missing %}
        {% for css_file in render_data.css_files %}
        {% if css_file != 'style.css' %}
        {%- include css_file ignore missing %}
        {% endif %}
        {% endfor %}
        {% endfilter %}
    </style>



</head>
<body>
    <div>
        <div id="Preview">
            <div id="WindowBorder">
                <div id="QueryBoxArea">
                    <div>
                      <div id="QueryBoxText" class="{{ '' if render_data.show_caret else 'no-caret' }}">{{ render_data.keyword }} {{ query }}</div>
                        <div id="QueryBoxSuggestion">{{ query_suggestion }}</div>
                        <div id="GlassIcon"><img src="{{ icon }}" width="32" height="32"></div>
                    </div>
                </div>
                <div id="Separator"></div>
                <div id="ResultsList">
                    {% for result in render_data.visible_results %}
                        <div class="item {{ 'selecteditem' if selection == loop.index0 else '' }}">
                            <div class="icon">
                                <img src="{{ result.icon }}" width="38" height="38">
                            </div>
                            <div class="item-text-container">
                                <div class="Title">{{ result.title }}</div>
                                <div class="SubTitle">{{ result.subtitle }}</div>
                            </div>
                            <div class="Hotkey">{{ 'Alt+' ~ loop.index if loop.index <= 9 else '' }}</div>
                        </div>
                    {% endfor %}
                    {% if results|length > max_results %}
                        <div id="ResultsScrollbar"><div class="thumb" style="height: {{ render_data.scrollbar_thumb_percent }}%"></div></div>
                    {% endif %}
                </div>
                <div id="WindowShine"></div>
        </div>
        <div id="Layer1"></div>
        <div id="Layer2"></div>
        <div id="Layer3"></div>
        <div id="Layer4"></div>
    </div>
</body>
</html>
