name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_branch: ${{ steps.pr.outputs.branch }}
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4

      - name: Read release PR
        id: pr
        if: steps.release.outputs.pr
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: |
          echo "branch=$(jq -r .headBranchName <<<"$PR")" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r .number <<<"$PR")" >> "$GITHUB_OUTPUT"

  build:
    name: Test and build
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.pr_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rc_tag: ${{ steps.rc.outputs.tag }}
      sha: ${{ steps.rc.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || needs.release-please.outputs.pr_branch }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: uv run pytest

      - name: Set release candidate version
        id: rc
        if: needs.release-please.outputs.release_created != 'true'
        run: |
          base=$(uv version --short)
          last=$(git tag -l "v${base}-rc.*" | sed 's/.*-rc\.//' | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          uv version "${base}rc${n}" --frozen
          echo "tag=v${base}-rc.${n}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Upload release assets
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach dist to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/* --repo "${{ github.repository }}" --clobber

  prerelease:
    name: Publish release candidate
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created != 'true' && needs.release-please.outputs.pr_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.rc_tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --prerelease \
            --target "${{ needs.build.outputs.sha }}" \
            --title "$TAG" \
            --notes "Release candidate built from #${{ needs.release-please.outputs.pr_number }}."
